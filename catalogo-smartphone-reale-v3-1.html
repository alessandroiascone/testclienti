:root{--blue:#0a84ff;--text:#1d1d1f;--muted:#6e6e73;--bg:#f5f5f7;--card:#fff;--line:#d2d2d7;--green:#5caf76;--vh:1vh}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;overflow-x:hidden}
button,input{font:inherit}
button{touch-action:manipulation}
#app{min-height:100vh;min-height:calc(var(--vh)*100);background:radial-gradient(50% 24% at 50% 30%,rgba(145,220,255,.15),transparent 70%),var(--bg)}
.topShell{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);border-bottom:1px solid rgba(0,0,0,.06);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.brandBar{height:86px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;align-items:center;max-width:920px;margin:auto;padding:8px 10px}
.brandBtn{height:66px;min-width:0;border:0;background:transparent;border-radius:16px;color:#858589;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;padding:0 3px}
.brandBtn .brandWord{white-space:nowrap;line-height:1}
.brandBtn[data-brand="Apple"] .brandWord{font-size:17px;font-weight:900;letter-spacing:-.04em}
.brandBtn[data-brand="Samsung"] .brandWord{font-size:13px;letter-spacing:.06em}
.brandBtn[data-brand="HONOR"] .brandWord{font-size:15px;letter-spacing:.08em}
.brandBtn[data-brand="OPPO"] .brandWord{font-size:17px;font-weight:600;text-transform:lowercase}
.brandBtn[data-brand="Motorola"] .brandWord{font-size:14px}
.brandBtn[data-brand="Realme"] .brandWord{font-size:16px;text-transform:lowercase}
.brandBtn.active{color:#111}
.brandBtn.active:after{content:"";position:absolute;left:22%;right:22%;bottom:1px;height:3px;border-radius:999px;background:var(--blue)}
.searchWrap{max-width:760px;margin:0 auto;padding:0 16px 14px}
.searchBox{height:58px;border:1px solid rgba(0,0,0,.08);border-radius:22px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.06);display:flex;align-items:center;gap:12px;padding:0 18px}
.searchIcon{font-size:22px;color:#8d8d92;line-height:1}
#search{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:18px;font-weight:600;min-width:0}
#search::placeholder{color:#8e8e93}
.clearBtn{border:0;background:#ececf0;width:28px;height:28px;border-radius:50%;color:#6e6e73;display:none;align-items:center;justify-content:center;cursor:pointer}
.clearBtn.show{display:flex}

.stage{position:relative;max-width:1180px;margin:0 auto;min-height:calc(var(--vh)*100 - 160px);padding:18px 20px 28px;display:flex;flex-direction:column;justify-content:center}
.productView{width:100%;min-height:660px;display:grid;grid-template-columns:minmax(340px,.92fr) minmax(420px,1.08fr);gap:54px;align-items:center}
.productHero{text-align:center;min-width:0}
.productTitle{font-size:clamp(42px,4.6vw,68px);line-height:.98;letter-spacing:-.045em;margin:0 auto 10px;font-weight:850;max-width:760px}
.slogan{font-size:clamp(18px,2vw,27px);color:var(--muted);font-weight:700;margin-bottom:12px}
.status{display:inline-flex;align-items:center;gap:9px;border-radius:999px;padding:10px 16px;background:#eef9f1;color:#568566;font-size:15px;font-weight:750}
.statusDot{width:10px;height:10px;border-radius:50%;background:#63bf7d}
.phoneImageWrap{height:410px;display:flex;align-items:center;justify-content:center;margin:8px auto 4px}
.phoneImage{max-width:92%;max-height:100%;object-fit:contain;filter:drop-shadow(0 20px 26px rgba(0,0,0,.10));user-select:none;-webkit-user-drag:none}
.fallbackPhone{display:none;align-items:center;justify-content:center;width:min(260px,72vw);min-height:120px;padding:18px;border-radius:20px;background:#fff;border:1px solid #e5e5e9;color:#8e8e93;font-size:14px;font-weight:700;text-align:center}
.fallbackPhone:after{content:"Immagine non disponibile"}

.sidePanel{min-width:0}
.browsePanel{text-align:center;max-width:660px;margin:0 auto}
.eyebrow{font-size:18px;color:#b34c00;font-weight:800;margin-bottom:6px}
.startRate{font-size:clamp(32px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:850;margin:0 0 24px}
.configureBtn{width:100%;border:0;border-radius:24px;padding:19px 20px;background:#087be7;color:#fff;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(10,132,255,.20)}
.swipeHint{margin-top:18px;color:#8e8e93;font-size:14px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}
.counter{font-variant-numeric:tabular-nums}
.empty{display:none;text-align:center;padding:80px 20px;color:#6e6e73}
.empty h2{color:#1d1d1f}

.configMode .topShell{display:none}
.configMode .stage{min-height:calc(var(--vh)*100);padding-top:12px;padding-bottom:18px}
.configMode .productView{min-height:calc(var(--vh)*100 - 30px);grid-template-columns:minmax(320px,.88fr) minmax(460px,1.12fr);gap:42px}
.configMode .productTitle{font-size:clamp(34px,3.6vw,52px)}
.configMode .slogan,.configMode .status{display:none}
.configMode .phoneImageWrap{height:440px;margin-top:0}
.configPanel{display:none}
.configMode .browsePanel{display:none}
.configMode .configPanel{display:block;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:28px;padding:20px;box-shadow:0 16px 44px rgba(0,0,0,.07)}
.configTop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.configModel{font-size:20px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.changePhone{border:0;background:transparent;color:#0071e3;font-size:16px;font-weight:800;cursor:pointer;white-space:nowrap}
.bubbles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.bubble{aspect-ratio:1/1;max-width:105px;width:100%;justify-self:center;border:2px solid #e1e1e5;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 5px;cursor:pointer;color:#a1a1a6}
.bubble.enabled{color:#262629;border-color:#9acbe9}
.bubble.current{border-color:var(--blue);box-shadow:0 0 0 6px rgba(10,132,255,.09)}
.bubble .bk{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8e8e93;margin-bottom:3px}
.bubble .bv{font-size:12px;font-weight:850;line-height:1.05;text-align:center;max-width:82px;overflow-wrap:anywhere}
.stepCard{border-top:1px solid #ececef;padding-top:16px}
.stepTitle{font-size:34px;letter-spacing:-.035em;line-height:1.02;margin:0 0 6px;font-weight:850}
.stepHint{font-size:16px;color:#7b7b80;margin:0 0 18px}
.optionGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;justify-content:center}
.optionBtn{min-height:58px;border:2px solid #d6d6da;background:#fff;border-radius:18px;font-weight:800;font-size:17px;color:#1d1d1f;cursor:pointer;padding:10px 14px}
.optionBtn.active{border-color:var(--blue)}
.optionGrid.single .optionBtn{grid-column:1/-1;max-width:320px;width:100%;justify-self:center}
.colorTitle{font-size:34px;letter-spacing:-.035em;line-height:1.02;margin:0 0 16px;font-weight:850}
.colorDots{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;padding:10px 0 6px}
.colorDot{width:48px;height:48px;border:3px solid transparent;border-radius:50%;background:transparent;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.colorDot span{display:block;width:31px;height:31px;border-radius:50%;border:1px solid rgba(0,0,0,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.colorDot.active{border-color:var(--blue)}
.rateGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rateBtn{min-height:52px;border:2px solid #d6d6da;background:#fff;border-radius:17px;font-size:18px;font-weight:850;cursor:pointer}
.rateBtn.active{border-color:var(--blue)}
.priceBox{margin-top:14px;border:1.5px solid #bdd9ea;background:linear-gradient(180deg,#f7fbff,#edf6fc);border-radius:22px;padding:18px 14px;text-align:center;display:none;cursor:pointer}
.priceBox.show{display:block}
.rateAmount{font-size:clamp(40px,5vw,60px);font-weight:900;letter-spacing:-.045em;line-height:1}
.rateAction{margin-top:9px;color:#087fda;font-size:17px;font-weight:850}
.rateTimer{margin-top:8px;color:#b8a122;font-size:14px;font-weight:750}

  .phoneImage{max-width:88%;max-height:100%}
  .sidePanel{width:100%;margin-top:-2px}
  .browsePanel{max-width:none;padding:0 4px}
  .eyebrow{font-size:16px;margin-bottom:4px}
  .startRate{font-size:clamp(33px,8.6vw,46px);margin-bottom:16px}
  .configureBtn{border-radius:22px;padding:17px 16px;font-size:18px}
  .swipeHint{margin-top:11px;font-size:12px}
  .configMode .stage{padding:4px 12px 14px;min-height:calc(var(--vh)*100)}
  .configMode .productView{min-height:calc(var(--vh)*100 - 18px);display:flex;gap:0}
  .configMode .productHero{display:flex;flex-direction:column}
  .configMode .productTitle{font-size:31px;margin:2px auto 0;order:0}
  .configMode .phoneImageWrap{height:clamp(260px,34vh,410px);margin:0 auto;order:1}
  .configMode .sidePanel{margin-top:0}
  .configMode .configPanel{padding:14px 14px 16px;border-radius:24px;box-shadow:none}
  .configTop{margin-bottom:10px}.configModel{font-size:16px}.changePhone{font-size:14px}
  .bubbles{gap:5px;margin-bottom:10px}
  .bubble{max-width:82px;padding:5px 3px}.bubble .bk{font-size:7px}.bubble .bv{font-size:10.5px;max-width:66px}
  .stepCard{padding-top:12px}.stepTitle,.colorTitle{font-size:27px}.stepHint{font-size:14px;margin-bottom:12px}
  .optionGrid{gap:9px}.optionBtn{min-height:48px;border-radius:15px;font-size:15px}
  .colorDots{gap:18px;padding:6px 0}.colorDot{width:44px;height:44px;padding:6px}.colorDot span{width:29px;height:29px}
  .rateGrid{gap:8px}.rateBtn{min-height:46px;border-radius:14px;font-size:16px}
  .priceBox{padding:14px 10px;border-radius:19px;margin-top:10px}.rateAmount{font-size:clamp(38px,10.8vw,52px)}.rateAction{font-size:15px}.rateTimer{font-size:12px}
}
@media(max-width:390px) and (max-height:760px){
 .phoneImageWrap{height:280px}.productTitle{font-size:34px}.slogan{font-size:18px}.configMode .phoneImageWrap{height:220px}.bubble{max-width:72px}.stepTitle,.colorTitle{font-size:24px}.optionBtn{min-height:44px}.rateBtn{min-height:42px}.rateAmount{font-size:38px}

@media(min-width:901px){.swipeHint:after{content:" · usa anche la rotellina"}}
</style>

</div>

document.addEventListener('touchend',function(e){if(state.mode!=='browse'||touchBlocked||!e.changedTouches.length)return;var dy=e.changedTouches[0].clientY-touchStartY,dx=e.changedTouches[0].clientX-touchStartX;if(Math.abs(dy)<46||Math.abs(dy)<Math.abs(dx)*1.15)return;go(dy<0?1:-1)},{passive:true});
var wheelLock=false;window.addEventListener('wheel',function(e){if(state.mode!=='browse'||interactiveTarget(e.target)||wheelLock||Math.abs(e.deltaY)<18)return;wheelLock=true;go(e.deltaY>0?1:-1);setTimeout(function(){wheelLock=false},420)},{passive:true});
window.addEventListener('keydown',function(e){if(state.mode!=='browse'||document.activeElement===search)return;if(e.key==='ArrowDown'||e.key==='PageDown')go(1);if(e.key==='ArrowUp'||e.key==='PageUp')go(-1)});

brandBar.addEventListener('click',function(e){var b=e.target.closest('.brandBtn');if(!b)return;var val=b.getAttribute('data-brand');state.brand=state.brand===val?null:val;state.query='';search.value='';clearSearch.classList.remove('show');resetConfig();applyFilters(true)});
search.addEventListener('input',function(){state.query=this.value;clearSearch.classList.toggle('show',!!this.value);state.brand=null;resetConfig();applyFilters(true)});
clearSearch.addEventListener('click',function(){search.value='';state.query='';clearSearch.classList.remove('show');resetConfig();applyFilters(true);search.focus()});
configureBtn.addEventListener('click',function(){state.mode='config';state.step='mem';state.mem=null;state.color=null;state.client=null;state.rate=null;stopTimer();renderCurrent()});
changePhone.addEventListener('click',function(){resetConfig();renderCurrent()});
bubbles.addEventListener('click',function(e){var b=e.target.closest('.bubble');if(!b||b.disabled)return;var step=b.getAttribute('data-goto');resetChoicesFrom(step);renderCurrent()});
stepCard.addEventListener('click',function(e){var t=e.target.closest('[data-select]');if(t){var type=t.getAttribute('data-select'),val=t.getAttribute('data-value'),g=currentGroup();if(type==='mem'){state.mem=val;state.color=null;state.client=null;state.rate=null;state.step='color';stopTimer();var cs=colorsForMem(g,state.mem);if(cs.length===1){state.color=cs[0];state.step='client'}}else if(type==='color'){state.color=val;state.client=null;state.rate=null;state.step='client';stopTimer()}else if(type==='client'){state.client=val;state.rate=null;state.step='rate';stopTimer()}else if(type==='rate'){state.rate=Number(val);state.step='rate';stopTimer()}renderCurrent();return}var pb=e.target.closest('.priceBox');if(pb&&state.rate)openWhatsApp()});
stepCard.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('priceBox')){e.preventDefault();openWhatsApp()}});

state.visible=GROUPS.slice();renderBrands();renderCurrent();
</script>
</body>
</html>
