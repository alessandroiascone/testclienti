<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anteprima catalogo ibrido Re Long</title>
<style>
:root{--accent:#0a84ff;--ink:#1d1d1f;--muted:#737378;--line:#e3e4e8;--bg:#f5f5f7;--card:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.06)}
.brandbar{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:10px 12px 6px}
.brand{border:0;background:transparent;padding:10px 2px 12px;font-weight:800;color:#8a8a8f;white-space:nowrap;position:relative;cursor:pointer;font-size:clamp(10px,2.7vw,15px)}
.brand.active{color:#151516}
.brand.active:after{content:"";position:absolute;left:18%;right:18%;bottom:3px;height:4px;border-radius:99px;background:var(--accent)}
.searchwrap{max-width:920px;margin:auto;padding:6px 16px 14px}
.search{width:100%;height:58px;border-radius:22px;border:1px solid #dedfe3;background:#fff;padding:0 18px 0 50px;font-size:18px;outline:none;box-shadow:0 8px 28px rgba(0,0,0,.045)}
.searchbox{position:relative} .searchicon{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:22px;color:#85858a}
.herohead{max-width:920px;margin:0 auto;padding:28px 18px 14px}
.herohead h1{font-size:clamp(31px,7vw,50px);line-height:1.02;margin:0;letter-spacing:-.04em}
.herohead p{font-size:16px;color:var(--muted);margin:9px 0 0}
.catalog{max-width:920px;margin:0 auto;padding:0 14px 80px;display:grid;gap:14px}
.product{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;background:#fff;border:1px solid #e7e7ea;border-radius:28px;padding:18px;min-height:192px}
.photo{width:150px;height:155px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#fbfbfd,#f1f4f8);border-radius:22px;overflow:hidden}
.photo img{max-width:92%;max-height:92%;object-fit:contain}
.photo .missing{font-size:12px;color:#9a9aa0;text-align:center;padding:12px}
.info{min-width:0}
.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#eff9f2;color:#4c8c60;padding:6px 10px;border-radius:999px;font-weight:750;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#63bd7b}
.info h2{font-size:clamp(21px,4.8vw,29px);line-height:1.03;margin:0 0 8px;letter-spacing:-.025em}
.rateLabel{font-size:13px;color:#aa4c00;font-weight:800;margin-bottom:2px}
.rate{font-size:clamp(23px,5vw,32px);font-weight:900;letter-spacing:-.03em}
.row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.configure{border:0;background:var(--accent);color:#fff;font-weight:800;padding:12px 20px;border-radius:15px;cursor:pointer;min-height:46px}
.small{font-size:12px;color:#88888d}
.empty{padding:50px 20px;text-align:center;color:#777}
.detail{display:none;min-height:100vh;background:var(--bg)}
.detail.show{display:block}
.list.hidden{display:none}
.detailTop{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid #e8e8eb;padding:10px 14px}
.detailTopInner{max-width:920px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{border:0;background:#eef6ff;color:#0874ce;padding:11px 14px;border-radius:13px;font-weight:800;cursor:pointer}
.change{border:0;background:transparent;color:#0874ce;font-weight:800;cursor:pointer}
.detailBody{max-width:920px;margin:auto;padding:22px 16px 80px}
.detailHero{text-align:center}
.detailHero h1{font-size:clamp(32px,8vw,52px);letter-spacing:-.045em;margin:0 0 10px}
.detailImg{width:min(420px,88vw);height:360px;margin:auto;display:flex;align-items:center;justify-content:center}
.detailImg img{max-width:100%;max-height:100%;object-fit:contain}
.flow{max-width:720px;margin:16px auto 0}
.step{background:#fff;border:1px solid #e4e5e9;border-radius:26px;padding:20px;margin-top:14px}
.step h3{font-size:26px;margin:0 0 14px;letter-spacing:-.03em}
.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.choice{border:2px solid #ddd;background:#fff;border-radius:14px;padding:12px 18px;min-width:94px;font-weight:800;cursor:pointer}
.choice.active{border-color:var(--accent)}
.colors{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:8px 0}
.colorDot{width:46px;height:46px;border-radius:50%;border:3px solid transparent;padding:5px;background:transparent;cursor:pointer}
.colorDot span{display:block;width:100%;height:100%;border-radius:50%;border:1px solid rgba(0,0,0,.2)}
.colorDot.active{border-color:var(--accent)}
.clientGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.finalPrice{margin-top:14px;background:#eff7ff;border:1px solid #c9e2f5;border-radius:22px;padding:20px;text-align:center}
.finalPrice strong{font-size:clamp(38px,9vw,56px);letter-spacing:-.045em}
.whatsapp{display:block;width:100%;margin-top:12px;border:0;background:#0a84ff;color:white;font-weight:850;border-radius:16px;padding:15px;cursor:pointer}
@media(min-width:900px){.catalog{grid-template-columns:1fr 1fr}.product{grid-template-columns:140px 1fr}}
@media(max-width:560px){
 .product{grid-template-columns:112px minmax(0,1fr);gap:13px;padding:14px;border-radius:24px;min-height:155px}
 .photo{width:112px;height:124px;border-radius:18px}
 .info h2{font-size:21px}
 .rate{font-size:24px}
 .brandbar{padding-left:5px;padding-right:5px;gap:0}
 .brand{font-size:10.5px}
 .search{height:56px;font-size:17px}
 .clientGrid{grid-template-columns:1fr}
 .rates{grid-template-columns:repeat(2,1fr)}
 .detailImg{height:320px}
}
</style>
</head>
<body>
<div id="listView" class="list">
  <div class="top">
    <div id="brandbar" class="brandbar"></div>
    <div class="searchwrap">
      <div class="searchbox"><span class="searchicon">⌕</span><input id="search" class="search" placeholder="Cerca nome o modello" autocomplete="off"></div>
    </div>
  </div>
  <div class="herohead"><h1>Scegli il tuo smartphone.</h1><p>Scorri il catalogo, poi configura solo il modello che ti interessa.</p></div>
  <main id="catalog" class="catalog"></main>
</div>

<div id="detailView" class="detail">
  <div class="detailTop"><div class="detailTopInner"><button id="backBtn" class="back">‹ Torna al catalogo</button><button id="changeBtn" class="change">Cambia smartphone</button></div></div>
  <div class="detailBody">
    <div class="detailHero">
      <h1 id="detailName"></h1>
      <div class="detailImg"><img id="detailImage" alt=""></div>
      <div id="detailStatus" class="badge"><span class="dot"></span><span></span></div>
    </div>
    <div class="flow">
      <section class="step"><h3>1. Memoria</h3><div id="memoryChoices" class="choices"></div></section>
      <section class="step"><h3 id="colorTitle">2. Colore</h3><div id="colorChoices" class="colors"></div></section>
      <section class="step"><h3>3. Che cliente sei?</h3><div class="clientGrid"><button class="choice client" data-client="existing">Già Cliente Vodafone</button><button class="choice client" data-client="switch">Passaggio da altro Gestore</button></div></section>
      <section class="step"><h3>4. Come vuoi pagare?</h3><div id="rateChoices" class="rates"></div><div id="finalPrice" class="finalPrice" style="display:none"><strong></strong><button class="whatsapp">Blocca questa rata su WhatsApp</button></div></section>
    </div>
  </div>
</div>

const brands=["Apple","Samsung","HONOR","OPPO","Motorola","Realme"];
const colors={blue:"#658db2",black:"#242426",green:"#88a88f",white:"#f4f4f4",pink:"#eab9c8",orange:"#cf8755",silver:"#c8cbd0",grey:"#777b82",gray:"#777b82",hematite:"#55565b",glacier:"#dce8f4",yellow:"#dfc84f",purple:"#8b79b0",red:"#8b2835"};
const state={brand:"Apple",search:"",group:null,variant:null,color:null,client:null,rate:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const money=n=>Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
function stripMemory(n){return String(n).replace(/\s+(\d+\s*(GB|TB))\s*$/i,"").trim()}
function memoryOf(n){const m=String(n).match(/(\d+\s*(GB|TB))\s*$/i);return m?m[1].replace(/\s+/g,"").toUpperCase():"Versione"}
function renderBrands(){
  $("#brandbar").innerHTML=brands.map(b=>`<button class="brand ${state.brand===b?"active":""}" data-b="${b}">${b==="HONOR"?"HONOR":b==="OPPO"?"oppo":b==="Realme"?"realme":b}</button>`).join("");
  document.querySelectorAll(".brand").forEach(el=>el.onclick=()=>{state.brand=el.dataset.b; renderBrands();renderCatalog();});
}
function matches(g){return g.brand===state.brand && (!state.search || g.base.toLowerCase().includes(state.search.toLowerCase()))}
function renderCatalog(){
  const list=groups.filter(matches);
  const root=$("#catalog");
  if(!list.length){root.innerHTML='<div class="empty">Nessun modello trovato.</div>';return}
  root.innerHTML=list.map((g,i)=>{
    const rate=g.minPrice/48;
    return `<article class="product">
      <div class="photo"><img src="${g.image}" alt="${esc(g.base)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="missing" style="display:none">Immagine non disponibile</div></div>
      <div class="info">
        <div class="meta"><span class="badge"><span class="dot"></span>${g.status==="DISPONIBILE"?"Disponibile":"Ordinabile"}</span></div>
        <h2>${esc(g.base)}</h2>
        <div class="rateLabel">A partire da</div><div class="rate">${money(rate)} €/mese</div>
        <div class="row"><button class="configure" data-i="${groups.indexOf(g)}">Configura</button><span class="small">${g.variants.length>1?g.variants.length+" memorie":"1 memoria"}</span></div>
      </div>
    </article>`;
  }).join("");
  document.querySelectorAll(".configure").forEach(btn=>btn.onclick=()=>openDetail(groups[Number(btn.dataset.i)]));
}
function openDetail(g){
 state.group=g; state.variant=g.variants[0]; state.color=null; state.client=null; state.rate=null;
 $("#listView").classList.add("hidden"); $("#detailView").classList.add("show"); window.scrollTo(0,0);
 $("#detailName").textContent=g.base; $("#detailImage").src=state.variant.img; $("#detailImage").alt=g.base;
 $("#detailStatus span:last-child").textContent=state.variant.stato==="DISPONIBILE"?"Disponibile":"Ordinabile";
 renderMemories(); renderColors(); renderClients(); renderRates(); updatePrice();
}
function closeDetail(){$("#detailView").classList.remove("show");$("#listView").classList.remove("hidden");window.scrollTo(0,0)}
function renderMemories(){
 $("#memoryChoices").innerHTML=state.group.variants.map((v,i)=>`<button class="choice mem ${v===state.variant?"active":""}" data-i="${i}">${memoryOf(v.nome)}</button>`).join("");
 document.querySelectorAll(".mem").forEach(b=>b.onclick=()=>{state.variant=state.group.variants[Number(b.dataset.i)];state.color=null;$("#detailImage").src=state.variant.img;renderMemories();renderColors();updatePrice();});
}
function renderColors(){
 const cs=(state.variant.colori&&state.variant.colori.length?state.variant.colori:["Black"]);
 if(!state.color) state.color=cs[0];
 $("#colorTitle").textContent="2. Colore - "+state.color;
 $("#colorChoices").innerHTML=cs.map(c=>`<button class="colorDot ${state.color===c?"active":""}" data-c="${c}" aria-label="${c}"><span style="background:${colors[c.toLowerCase()]||"#ccc"}"></span></button>`).join("");
 document.querySelectorAll(".colorDot").forEach(b=>b.onclick=()=>{state.color=b.dataset.c;renderColors();});
}
function renderClients(){
 document.querySelectorAll(".client").forEach(b=>{b.classList.toggle("active",b.dataset.client===state.client);b.onclick=()=>{state.client=b.dataset.client;renderClients();updatePrice();}});
}
function renderRates(){
 const rs=[12,18,24,30,36,48];
 $("#rateChoices").innerHTML=rs.map(r=>`<button class="choice rte ${state.rate===r?"active":""}" data-r="${r}">${r}</button>`).join("");
 document.querySelectorAll(".rte").forEach(b=>b.onclick=()=>{state.rate=Number(b.dataset.r);renderRates();updatePrice();});
}
function updatePrice(){
 const box=$("#finalPrice");
 if(!state.variant||!state.client||!state.rate){box.style.display="none";return}
 let amount=state.variant.prezzo/state.rate;
 if(state.client==="switch") amount+=11.95;
 box.style.display="block"; box.querySelector("strong").textContent=money(amount)+" €/mese";
}
$("#search").addEventListener("input",e=>{state.search=e.target.value.trim();renderCatalog()});
$("#backBtn").onclick=closeDetail; $("#changeBtn").onclick=closeDetail;
renderBrands();renderCatalog();
})();
</script>
